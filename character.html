<html>

<head>
  <title>CripShip: Character Generator</title>
</head>

<body>
  <style>
    .container{
      background: url('/imgs/splatter2_big.png') no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .id-card {
      width: 70%;
      max-width: 980px;
      background-image: url('/imgs/laid_paper_dirty.jpg');
      border-radius: 12px;
      border: 1px solid #c1beb7;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      
    }

    .top-section {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .bottom-section {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .footer-logo{
      flex: 1;
    }

    .barcode{
      align-content: flex-end;
      height: 80px;
    }

    .photo {
      width: 300px;
      height: 350px;
      background-color: #fafaf4;
      border: 1px dashed #ccccbb;
      border-radius: 8px;
      overflow: hidden;
      margin-right: 20px;
      text-align: center;
      box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.2);
    }

    .photo img {
      width: 95%;
      height: 95%;
      opacity: 0.05;
      object-fit: cover;
      
    }

    .ministry {
      text-align: right;
      font-family: "monomials";
    }

    .details {
      flex: 1;
    }

    h2,
    p {
      margin: 5px 0;
    }

    .label {
      font-weight: bold;
      color: #3d1d07;
      font-family: "monomials";
    }

    .full-width {
      margin-top: 10px;
      width: 100%;
    }

    .signature {
      margin-top: 20px;
      margin-left: 20px;
      font-family: 'Brush Script MT', cursive;
      font-size: 30px;
      color: #03003f;
    }

    .id-card input[type=text]{
      width: 100%;
      height: 50px;
      font-size: 1.5em;
    }

    .id-card input[type=checkbox]{
      width: 20px;
      height: 20px;
      margin-left: 20px;
      margin-right: 20px;
    }

    .controls{
      width:100%;
      text-align: center;
    }

    .controls input{
      font-size: 1.3em;
      padding: 20px;
      margin: 20px;
    }

    .inject{
      font-size: 1.3em;
    }

    .full-inject{
      margin-left: 20px
    }

    .title{
      margin-top: 20px;
    }


    .buttons {
      list-style: none;
      gap: 1.5rem;
      flex-direction: row;
      flex-wrap: wrap;
      display: flex;

      cursor: default;
      justify-content: center;
      letter-spacing: 0;
      padding: 0;
      text-align: center;
    }


    .buttons:not(:last-child) {
      margin-bottom: 2.125rem !important;
    }

    .buttons:not(:first-child) {
      margin-top: 2.125rem !important;
    }

    .button {
      background-color: #000000;
      color: #fff;
      border: solid 1px #9d7901;

      display: inline-block;
      width: 10.25rem;
      height: 3.125rem;
      line-height: calc(3.125rem - 2px);
      padding: 0.5rem 0.5rem;
      vertical-align: middle;
      font-size: 1.0em;
      font-weight: 400;
      border-radius: 0rem;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;

    }

    .center {
      display: block;
      margin-left: auto;
      margin-right: auto;
      width: 50%;
    }

    body {
      background-image: url('/imgs/background.jpg');
      /*font-family: "Helvetica Neue", Helvetica, sans-serif; */
      font-family: "terminus";
      font-size: 1.5em;
    }

    h1,
    h2 {
      text-anchor: middle;
      /*font-family: "Helvetica Neue", Helvetica, sans-serif; */
      font-family: "monomials";
      fill: #1C143B;
      font-size: 40px;
    }

    h2 {
      font-size: 30px;
    }

    h3 {
      font-size: 25px;
    }


    .header {
      width: 100%;
      text-align: center;
      margin-top: 1em;

    }

    .footer {
      width: 100%;
      text-align: center;
      margin-top: 5em;
      margin-bottom: 5em;
      background: url('/imgs/splatter3.png') left no-repeat;
    }

    .moss {
      position: fixed;
      width: 10%;
      margin: auto;
      margin: 0px;
      padding: 0px;
      opacity: 0.5;


    }

    .splash {
      border-radius: 5px;
      background: url('/imgs/handwriting_paper.jpg') top center;
      background-size: 100% 50%;
      background-color: transparent;
      margin: 10px;
      padding: 1em;
      box-shadow: 1px 2px 5px #444;
      border: 0.5px solid color(srgb 0.69 0.6225 0.5451);
      max-width: 1200px;
      justify-content: center;
    }

    hr {
      width: 100%;
      height: 5px;
      border: 0px;
      opacity: 0.21;
      border-radius: 2px;

      background: linear-gradient(to right, black, rgb(185, 1, 1), rgb(255, 255, 0), rgb(0, 255, 213), rgb(0, 127, 0), black);
    }

    .spacer {
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .logo {
      opacity: 0.9;
    }

    @font-face {
      font-family: "monomials";
      src: url("/fonts/Monomials.ttf");
    }

    @font-face {
      font-family: "terminus";
      src: url("/fonts/TerminusTTF-4.49.3.ttf");
    }

    .wrapper {
      -webkit-overflow-scrolling: touch;
      align-items: stretch;
      display: flex;
      flex-direction: row;
      justify-content: center;
      min-height: var(--viewport-height);
      overflow: hidden;
      position: relative;
      z-index: 2;

    }

    #main {
      width: 100%;
      display: flex;
      justify-content: center;
      background: url('/imgs/splatter2_big.png') no-repeat;
    }

    .inner {
      padding-left: 30px;
      padding-right: 30px;
    }

    .content {
      width: 100%;
      text-align: center;
      margin-top: 5em;
      margin-bottom: 5em;
    }

    .logo {
      background: url('/imgs/splatter5.png') no-repeat;
    }
  </style>

  <script>
    background = [];
    background[0] = ["Make the world a better place", "Fund your creative endeavours", "Undercover journalist", "Performance artist", "Corporate Spy"];
    background[1] = ["Help someone who does not expect it", "Find a new creative endeavour during the case", "Find a surprising lead for a new story", "Discover a new mode of being and express it", "Create a new AI buzzword never heard before"];

    intentions = [];
    intentions[0] = ["Use an accessibility aid in a spectacular way", "Find a completely unproductive but cool way to use AI", "Undermine the authority of an AI CEO", "Destroy an AI in a spectacular fashion", "Get an AI to swear at you", "Corrupt an AI's training dataset in a subtle way", "Build worker power", "Plant a seed for a surprising revolution"];


    experience = [];
    experience[0] = ["Criptastic Hack", "Crip-Kinship", "Crip-time", "World Builders", "World Breakers", "Dreaming Justice"];

    look = [];
    look[0] = ["Film noir", "Solar punk", "Aquatic", "Academic", "Ancient", "Baroque", "Supernatural", "Cripborg", "Gothic", "Steampunk", "Aquatic", "Recycled/Vintage", "Inter-dimensional", "Artificial", "Futuristic", "Androgynous", "Surreal", "Forgotten", "Clandestine", "Haute couture"];
    look[1] = ["Machinic", "Business casual", "Unorthodox", "Subversive", "Revolutionary", "Haunted", "Jaded", "Watchful", "Methodical", "Brooding", "Romantic", "Translucent", "Guarded", "Conflicted", "Sceptical", "Eccentric", "Inquisitive", "Intense", "Resourceful", "Unshakeable"];
    look[2] = ["Human", "Animal", "Sea creature", "Fungus", "Plant", "Ghost/Shadow", "Insect", "Gas", "Robot", "Cripborg", "Scientist", "Bureaucrat", "Archivist/Collector", "Poet", "Detective", "Element of nature", "Hive Mind/Union", "Hologram", "Luddite", "Occultist"];

    equipment = [];
    equipment[0] = ["Hand crafted", "Biological", "Otherworldly/ethereal", "High-tech/Magical", "Self destructing", "Self homing", "Psychedelic/Dreamlike", "Anti-gravity", "Haunted/Malevolent", "Antique", "Fortune telling", "Opulent/Radiant", "Fluffy/Fuzzy", "Hypnotic", "Shapeshifting", "Sentient", "Parasitic", "Musical", "Stealthy", "Emergency"];
    equipment[1] = ["Whispering", "Glimmering", "Luminescent", "Chaotic", "Collapsible", "Solar-powered", "Discreet", "Biodegradable", "Transparent", "Weightless", "Modular", "Fractal", "Unauthorised", "Shadowy", "Experimental", "Stylish", "Monstrous", "Heat-resistant", "Hand-cranked", "Ministry certified"];
    equipment[2] = ["Wheelchair", "Watch", "Eyeglasses", "Stick", "Cape", "Procedure Manual", "Weapon", "Notepad & pen", "Crutches", "Flashlight", "Wifi jammer", "Spoons", "Mirror", "Pills", "Magnet", "Sealant", "Key fob", "Pet (organic)", "Spray Paint", "Rubber stamp"];


    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function d6() {
      return Math.floor(Math.random() * 5);
    }

    function d20() {
      return Math.floor(Math.random() * 19);
    }

    function getRandomNoun() {
      return d[d6()][d6()];
    }

    function make() {
      let bdice = d6();
      let b = background[0][bdice];
      let bi = background[1][bdice];
      document.getElementById("background").innerHTML = b;
      document.getElementById("background-intent").innerHTML = bi;

      let idice = d6();
      let is = shuffle(intentions[0]);
      let i1 = is[idice];
      let i2 = is[idice + 1];
      document.getElementById("intention1").innerHTML = i1;
      document.getElementById("intention2").innerHTML = i2;

      let edice = d6();
      let e = experience[0][edice];
      document.getElementById("experience").innerHTML = e;

      let l1dice=d20();
      let l2dice=d20();
      let l3dice=d20();

      let look1 = look[0][l1dice];
      let look2 = look[1][l2dice];
      let look3 = look[2][l3dice];

      document.getElementById("look1").innerHTML = look1+",";
      document.getElementById("look2").innerHTML = look2+",";
      document.getElementById("look3").innerHTML = look3;

      let e1dice = d20();
      let e2dice = d20();
      let e3dice = d20();

      let equip1 = equipment[0][e1dice];
      let equip2 = equipment[1][e2dice];
      let equip3 = equipment[2][e3dice];

      document.getElementById("equip1").innerHTML = equip1+",";
      document.getElementById("equip2").innerHTML = equip2+",";
      document.getElementById("equip3").innerHTML = equip3;

      let finalId = bdice + "" + idice +"" + edice + "-" + l1dice+ "" +l2dice +"" + l3dice + "-" + e1dice +"" + e2dice +"" + e3dice;
      document.getElementById("idcode").innerHTML = finalId;


    }

    function sign(){
      let n = document.getElementById("name").value
      document.getElementById("sig").innerHTML = n;
      
    }

  </script>

  <div class="controls">
    <input type="button" value="Click to Generate a Random Character" onClick="make();"></input>
  </div>

  <div class="container">
  <div class="id-card">
    <div class="ministry"><img height="20px" src="/imgs/stamps_01.svg"></div>
    <div class="ministry"><img height="50px" src="/imgs/clean_ministry_small.png">Ministry of AI Spills</div>
    <div class="top-section">
      <div class="photo">
        <img src="/imgs/profile_default_04.jpg" alt="Photo" />
      </div>
      <div class="details">
        <p class="title"><span class="label">Name:</span></p>
        <p><input type="text" id="name" onchange="sign()"></p>
        <p class="title"><span class="label">Pronouns:</span></p>
        <p><input type="text"></p>

        <p class="title"><span class="label ">Look/Description:</span></p>
        <p class="inject"><span  id="look1"></span> <span id="look2"></span> <span id="look3"></span></p>
        <p class="title"><span class="label">ID:</span><span id="idcode"></span></p>
        <p class="title"><span class="label">Department:</span>Field Agent</p>
      </div>
    </div>
    
    
    <p class="full-width" style="text-align: center; opacity: 0.5;"><img width="80" src="/imgs/stamps_02.png"></p>

    <p style="margin-left:-20px; margin-right:-20px; padding: 0px;"><img width="100%" src="/imgs/fold.png"></p>

   
    <p class="full-width title"><span class="label">Background:</span> <span id="background"></span></p>

    <p class="full-width"><input type="checkbox"><span id="background-intent"></span></p>

    <p class="full-width title"><span class="label">Intentions:</span> 
      <div><input type="checkbox"><span id="intention1"></span></div>
      <div><input type="checkbox"><span id="intention2"></span></div></p>
    <p class="full-width title"><span class="label">Experience:</span></p>
    <p class="full-width full-inject"><span id="experience"></span></p>
    
    

    <p class="full-width title"><span class="label">Equipment:</span></p>
    <p class="full-width"><input type="checkbox"></input>AI Mapper</p>
    <p class="full-width"><input type="checkbox"></input><span id="equip1"></span> <span id="equip2"></span> <span id="equip3"></span></p>

  

    <p class="full-width"><span class="label">Signed:</span><span class="signature" style="border-bottom: 1px dotted #000000;" id="sig">.....</span></p>
    
    <p><hr></p>

    <div class="bottom-section">
      <div class="barcode">
        <p style="float:left; font-size:0.5em;"><img height="20px" src="/imgs/stamps_03.png"> 12101 0201201 0210101 ########## ---------------------  </p> </div>
      <div class="footer-logo"><img style="float:right; opacity: 0.8;" alt="" width="80px" src="/imgs/icon_bw.png"></div>
    </div>
  </div>
  
</div>



</body>

</html>
